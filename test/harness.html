<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kokohome harness</title>
<style>
  :root { --card-background-color: #fff; --primary-color: #3b82f6; --divider-color: #e4e4e7; }
  body { margin: 0; padding: 20px; background: #fafafa; font-family: system-ui, sans-serif; }
  body.dark { background: #09090b; --card-background-color: #111113; --divider-color: #27272a; color: #f4f4f5; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--col, 340px), 1fr)); gap: 16px; align-items: start; }
  .case { min-width: 0; }
  .case > h4 { margin: 0 0 6px; font: 600 11px/1.2 ui-monospace, monospace; color: #71717a; text-transform: uppercase; letter-spacing: .04em; }
  @media (min-width: 760px) { .case.wide { grid-column: span 2; } }
</style>
<script>
  // Stand-in for HA's <ha-icon>. The real MDI set isn't available offline, so
  // common mdi: names map to look-alike Lucide line icons (ISC); others get a dot.
  const ICONS = [
    [/power/, '<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>'],
    [/bulb|lamp|light|ceiling/, '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>'],
    [/home|house/, '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'],
    [/sofa/, '<path d="M20 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v3"/><path d="M2 16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v1.5a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5V11a2 2 0 0 0-4 0z"/><path d="M4 18v2"/><path d="M20 18v2"/>'],
    [/bed/, '<path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/>'],
    [/tele|tv|monitor/, '<rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/>'],
    [/night|moon|sleep/, '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'],
    [/account-multiple|group/, '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'],
    [/account|person|walk/, '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'],
    [/air|fan|wind/, '<path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/>'],
    [/thermo/, '<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>'],
    [/lock/, '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'],
    [/script|text|list/, '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/>'],
    [/cctv|camera|video|cam/, '<path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/>'],
    [/airplane|plane/, '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>'],
    [/bell|doorbell|bullhorn|siren/, '<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>'],
    [/flash|lightning|energy|bolt/, '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>'],
    [/speaker|volume|music/, '<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>'],
    [/play/, '<polygon points="6 3 20 12 6 21 6 3"/>'],
    [/palette|movie|scene|star|sparkle/, '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>'],
    [/delete|trash/, '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>'],
    [/check/, '<path d="M20 6 9 17l-5-5"/>'],
  ]
  customElements.define('ha-icon', class extends HTMLElement {
    static get observedAttributes() { return ['icon'] }
    connectedCallback() { this.paint() }
    attributeChangedCallback() { this.paint() }
    set icon(v) { this.setAttribute('icon', v) }
    get icon() { return this.getAttribute('icon') }
    paint() {
      const name = (this.getAttribute('icon') || '').replace(/^mdi:/, '')
      const hit = ICONS.find(([re]) => re.test(name))
      const body = hit ? hit[1] : '<circle cx="12" cy="12" r="4"/>'
      this.style.display = 'inline-flex'
      this.style.width = this.style.width || '18px'; this.style.height = this.style.height || '18px'
      this.innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`
    }
  })
  // Stand-in for Lovelace card helpers (nested cards in container components).
  window.loadCardHelpers = async () => ({
    createCardElement(config) {
      if (config.type && config.type.startsWith('custom:')) {
        const el = document.createElement(config.type.slice(7)); el.setConfig(config); return el
      }
      const el = document.createElement('div')
      el.className = 'mock-card'
      el.style.cssText = 'padding:16px;border-radius:12px;border:1px solid var(--divider-color);background:var(--card-background-color);font-size:13px'
      el.innerHTML = `<b>${config.title || config.type}</b><div style="opacity:.6;margin-top:6px">${config.text || 'Nested ' + config.type + ' card'}</div>`
      return el
    },
  })
</script>
</head>
<body>
<div id="grid"></div>
<script type="module">
  import { makeHass } from './mock-hass.js'
  const params = new URLSearchParams(location.search)
  // ?cases=other.js renders another case set; it may export STATES to add to the mock.
  const mod = await import('./' + (params.get('cases') || 'cases.js'))
  const CASES = mod.CASES
  const dark = params.get('dark') === '1'
  const only = params.get('only')
  if (params.get('col')) document.documentElement.style.setProperty('--col', params.get('col'))
  if (dark) document.body.classList.add('dark')
  await import('../kokohome.js')
  // kokonut-lamp loads React from a CDN the test box cannot reach: stand in a plain box.
  if (params.get('lamp') === '1' && !customElements.get('kokonut-lamp')) customElements.define('kokonut-lamp', class extends HTMLElement {
    setConfig(c) { this.c = c; this.style.cssText = 'display:block;height:230px;border:1px dashed #999;border-radius:12px;padding:8px;font:12px sans-serif' ; this.textContent = 'lamp ' + c.entity }
    set hass(h) {}
  })
  const hass = makeHass({ dark })
  if (mod.STATES) Object.assign(hass.states, mod.STATES)
  window.__hass = hass
  const grid = document.getElementById('grid')
  const cards = []
  for (const c of CASES) {
    if (only && !only.split(',').includes(c.id)) continue
    const wrap = document.createElement('div')
    wrap.className = 'case' + (c.wide ? ' wide' : '')
    wrap.id = 'case-' + c.id
    wrap.innerHTML = `<h4>${c.id}</h4>`
    const el = document.createElement(c.config.type.replace('custom:', ''))
    try { el.setConfig(c.config) } catch (e) { wrap.innerHTML += `<pre style="color:red">${e.message}</pre>`; grid.append(wrap); continue }
    el.hass = hass
    wrap.append(el); grid.append(wrap); cards.push(el)
  }
  window.__setStates = (states) => { window.__hass = { ...window.__hass, states }; for (const el of cards) el.hass = window.__hass }
  window.__pushHass = () => window.__setStates(window.__hass.states)
  window.__ready = true
</script>
</body>
</html>
