name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      # Commit the freshly built bundle back onto the tag's commit so jsDelivr
      # can serve dist/kokonut-light-card.js at this version.
      - name: Attach built bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kokonut-light-card.js
